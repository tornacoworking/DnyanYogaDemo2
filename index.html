<!doctype html>
<!--
  index.html
  The HTML "shell" of every page. Vite adds the CSS/JS links when building, and
  scripts/prerender.js copies this file for every page, filling in two markers:
    "seo-head" (in the head)  =that page's title, description, canonical and social tags
    "app-html" (in #root)   = that page's content, already rendered (great for SEO and speed)
-->
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile viewport. Zoom is NOT blocked (blocking it fails accessibility checks). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tints the browser bar on phones in brand navy -->
    <meta name="theme-color" content="#23206B" />
    <!-- Stop iOS from turning random numbers into phone links -->
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- TODO: after verifying the site in Google Search Console, paste its meta tag here. -->
    <!--seo-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
