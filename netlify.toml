# netlify.toml: settings used only when the site is hosted on Netlify.
# Build command and output folder.

[build]
  command = "npm run build"
  publish = "dist"

# Same security headers as vercel.json (improve the Lighthouse "Best Practices" score).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built JS/CSS files have a unique name per version, so browsers may cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
